<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA App 2025/26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0E14;
  --card: #151A24;
  --line: #232B3A;
  --text: #EDEFF4;
  --muted: #8B93A7;
  --orange: #E8743B;
  --red: #e74c3c;
  --green: #2ecc71;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Heebo', sans-serif; padding-bottom: 60px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 14px; }

/* Navigation & Header */
header {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-tabs { display: flex; gap: 10px; }
.tab-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-family: inherit;
  transition: 0.2s;
}
.tab-btn.active, .tab-btn:hover {
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
}
.lang-btn {
  background: var(--line);
  color: var(--text);
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

/* Page Views */
.page { display: none; padding-top: 20px; }
.page.active { display: block; }

/* Teams Controls */
.controls { display: flex; gap: 10px; margin-bottom: 20px; }
select {
  background: var(--card); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 700;
}

/* Table Design */
.team-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.team-head img { width: 45px; height: 45px; object-fit: contain; }
.team-head h2 { font-size: 22px; margin: 0; }

table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; }
thead th { text-align: start; font-size: 11px; color: var(--muted); padding: 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); }
tbody tr { cursor: pointer; transition: 0.15s; }
tbody tr:hover { background: rgba(255,255,255,.04); }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }

.player-cell { display: flex; align-items: center; gap: 10px; }
.player-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--line); object-fit: cover; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.badge-injured { background: rgba(231, 76, 60, 0.2); color: var(--red); }
.badge-starter { background: rgba(46, 204, 113, 0.2); color: var(--green); }

/* Modal Player Details */
.modal-overlay {
  position: fixed; top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  width: 90%; max-width: 500px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto;
}
.close-modal { position: absolute; top: 15px; left: 15px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
html[dir="ltr"] .close-modal { left: auto; right: 15px; }

.modal-header { text-align: center; margin-bottom: 16px; }
.modal-header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: var(--line); }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; background: var(--bg); padding: 14px; border-radius: 10px; }
.modal-field { font-size: 13px; }
.modal-field strong { display: block; color: var(--muted); font-size: 11px; }

/* Games View Cards */
.games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.game-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.game-team { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.game-score { font-size: 18px; color: var(--orange); }
</style>
</head>
<body>

<header>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('teams')" id="tabTeams">קבוצות</button>
    <button class="tab-btn" onclick="switchTab('games')" id="tabGames">משחקים</button>
  </div>
  <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
</header>

<div class="wrap">
  <div id="teamsPage" class="page active">
    <div class="controls">
      <select id="teamSelect" onchange="renderTeam(this.value)"></select>
    </div>
    <div class="team-head">
      <img id="teamLogo" src="" alt="Logo">
      <h2 id="teamName"></h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th id="thPlayer">שחקן</th>
          <th id="thPos">עמדה</th>
          <th id="thStatus">סטטוס</th>
          <th>נק'</th>
          <th>ריב'</th>
          <th>אס'</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="gamesPage" class="page">
    <h2 id="gamesTitle">משחקי השבוע</h2>
    <div class="games-grid" id="gamesGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="playerModal">
  <div class="modal">
    <button class="close-modal" onclick="closeModal()">✕</button>
    <div class="modal-header">
      <img id="mImg" src="" alt="Player Image">
      <h2 id="mName" style="margin:8px 0 0;"></h2>
      <span id="mPos" style="color:var(--muted); font-size:13px;"></span>
    </div>
    <div class="modal-grid">
      <div class="modal-field"><strong id="lblHeight">גובה:</strong><span id="mHeight"></span></div>
      <div class="modal-field"><strong id="lblBirth">תאריך/מקום לידה:</strong><span id="mBirth"></span></div>
      <div class="modal-field"><strong id="lblTeams">קבוצות בקריירה:</strong><span id="mTeams"></span></div>
      <div class="modal-field"><strong id="lblCareerPts">סה"כ נק' בקריירה:</strong><span id="mCareerPts"></span></div>
    </div>
    <div style="margin-top: 14px;">
      <strong id="lblTrophies" style="color:var(--muted); font-size:12px; display:block; margin-bottom:4px;">תארים והישגים:</strong>
      <div id="mTrophies" font-size:13px;></div>
    </div>
  </div>
</div>

<script>
let currentLang = 'he';

// Translations Dictionary
const i18n = {
  he: {
    tabTeams: "קבוצות", tabGames: "משחקים", langBtn: "English",
    thPlayer: "שחקן", thPos: "עמדה", thStatus: "סטטוס",
    starter: "הרכב ראשון", injured: "פצוע", fit: "כשיר",
    lblHeight: "גובה:", lblBirth: "תאריך/מקום לידה:", lblTeams: "קבוצות בקריירה:",
    lblCareerPts: "סה\"כ נק' בקריירה:", lblTrophies: "תארים והישגים:", gamesTitle: "משחקים קרובים / תוצאות"
  },
  en: {
    tabTeams: "Teams", tabGames: "Games", langBtn: "עברית",
    thPlayer: "Player", thPos: "Position", thStatus: "Status",
    starter: "Starter", injured: "Injured", fit: "Active",
    lblHeight: "Height:", lblBirth: "Birth Date/Place:", lblTeams: "Career Teams:",
    lblCareerPts: "Career Pts:", lblTrophies: "Accolades & Trophies:", gamesTitle: "Upcoming Games / Results"
  }
};

// Data Structure
const playersData = {
  "1629630": { nameHe: "ג'יילן ברנסון", nameEn: "Jalen Brunson", pos: "PG", height: "1.88m", birth: "31/08/1996, ניו ג'רזי", teams: "Dallas, NY Knicks", careerPts: "8,420", trophiesHe: "2× אולסטאר, אלוף מכללות (NCAA)", trophiesEn: "2× All-Star, 2× NCAA Champion", pts: 26.0, reb: 3.3, ast: 6.8, starter: true, injured: false },
  "1626157": { nameHe: "קרל-אנתוני טאונס", nameEn: "Karl-Anthony Towns", pos: "C", height: "2.13m", birth: "15/11/1995, ניו ג'רזי", teams: "Minnesota, NY Knicks", careerPts: "13,100", trophiesHe: "4× אולסטאר, רוקי השנה (2016)", trophiesEn: "4× All-Star, Rookie of the Year", pts: 20.1, reb: 11.9, ast: 3.0, starter: true, injured: false },
  "1628973": { nameHe: "ג'יילן ברונסון (פצוע לדוגמה)", nameEn: "Mitchell Robinson", pos: "C", height: "2.13m", birth: "01/04/1998, פלורידה", teams: "NY Knicks", careerPts: "2,800", trophiesHe: "שיאן חסימות מכללות", trophiesEn: "College Block Leader", pts: 5.7, reb: 8.8, ast: 0.9, starter: false, injured: true },
  "203999": { nameHe: "ניקולה יוקיץ'", nameEn: "Nikola Jokic", pos: "C", height: "2.11m", birth: "19/02/1995, סרביה", teams: "Denver Nuggets", careerPts: "14,120", trophiesHe: "1× אלוף ה-NBA, 3× MVP, 6× אולסטאר", trophiesEn: "1× NBA Champ, 3× MVP, 6× All-Star", pts: 27.7, reb: 12.9, ast: 10.7, starter: true, injured: false }
};

const teamsData = {
  nyk: { nameHe: "ניו יורק ניקס", nameEn: "New York Knicks", logo: "https://cdn.nba.com/logos/nba/1610612752/primary/L/logo.svg", players: ["1629630", "1626157", "1628973"] },
  den: { nameHe: "דנוור נאגטס", nameEn: "Denver Nuggets", logo: "https://cdn.nba.com/logos/nba/1610612743/primary/L/logo.svg", players: ["203999"] }
};

const gamesData = [
  { home: "ניו יורק ניקס", homeEn: "NY Knicks", away: "דנוור נאגטס", awayEn: "Denver Nuggets", score: "108 - 102", status: "Final" },
  { home: "בוסטון סלטיקס", homeEn: "Boston Celtics", away: "לייקרס", awayEn: "LA Lakers", score: "22:00", status: "Upcoming" }
];

// Methods
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  
  if(tab === 'teams') {
    document.getElementById('tabTeams').classList.add('active');
    document.getElementById('teamsPage').classList.add('active');
  } else {
    document.getElementById('tabGames').classList.add('active');
    document.getElementById('gamesPage').classList.add('active');
  }
}

function toggleLang() {
  currentLang = currentLang === 'he' ? 'en' : 'he';
  const html = document.getElementById('htmlTag');
  html.setAttribute('dir', currentLang === 'he' ? 'rtl' : 'ltr');
  html.setAttribute('lang', currentLang);
  
  // Update UI Text
  const t = i18n[currentLang];
  Object.keys(t).forEach(id => {
    const el = document.getElementById(id);
    if(el) el.textContent = t[id];
  });

  populateTeamSelect();
  renderTeam(document.getElementById('teamSelect').value);
  renderGames();
}

function populateTeamSelect() {
  const sel = document.getElementById('teamSelect');
  sel.innerHTML = '';
  Object.keys(teamsData).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = currentLang === 'he' ? teamsData[key].nameHe : teamsData[key].nameEn;
    sel.appendChild(opt);
  });
}

function renderTeam(key) {
  const team = teamsData[key] || teamsData['nyk'];
  document.getElementById('teamName').textContent = currentLang === 'he' ? team.nameHe : team.nameEn;
  document.getElementById('teamLogo').src = team.logo;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = team.players.map((id, index) => {
    const p = playersData[id];
    const name = currentLang === 'he' ? p.nameHe : p.nameEn;
    const imgUrl = `https://cdn.nba.com/headshots/nba/latest/260x190/${id}.png`;
    
    let statusBadge = `<span class="badge">${i18n[currentLang].fit}</span>`;
    if(p.injured) statusBadge = `<span class="badge badge-injured">${i18n[currentLang].injured}</span>`;
    else if(p.starter) statusBadge = `<span class="badge badge-starter">${i18n[currentLang].starter}</span>`;

    return `<tr onclick="openPlayerModal('${id}')">
      <td>${index + 1}</td>
      <td>
        <div class="player-cell">
          <img class="player-avatar" src="${imgUrl}" onerror="this.src='https://cdn.nba.com/headshots/nba/latest/260x190/fallback.png'" alt="${name}">
          <span>${name}</span>
        </div>
      </td>
      <td>${p.pos}</td>
      <td>${statusBadge}</td>
      <td>${p.pts}</td>
      <td>${p.reb}</td>
      <td>${p.ast}</td>
    </tr>`;
  }).join('');
}

function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = gamesData.map(g => `
    <div class="game-card">
      <div class="game-team">
        <span>${currentLang === 'he' ? g.home : g.homeEn}</span>
      </div>
      <div class="game-score" style="text-align:center;">${g.score}</div>
      <div class="game-team">
        <span>${currentLang === 'he' ? g.away : g.awayEn}</span>
      </div>
    </div>
  `).join('');
}

function openPlayerModal(id) {
  const p = playersData[id];
  document.getElementById('mImg').src = `https://cdn.nba.com/headshots/nba/latest/260x190/${id}.png`;
  document.getElementById('mName').textContent = currentLang === 'he' ? p.nameHe : p.nameEn;
  document.getElementById('mPos').textContent = p.pos;
  document.getElementById('mHeight').textContent = p.height;
  document.getElementById('mBirth').textContent = p.birth;
  document.getElementById('mTeams').textContent = p.teams;
  document.getElementById('mCareerPts').textContent = p.careerPts;
  document.getElementById('mTrophies').textContent = currentLang === 'he' ? p.trophiesHe : p.trophiesEn;
  
  document.getElementById('playerModal').classList.add('open');
}

function closeModal() {
  document.getElementById('playerModal').classList.remove('open');
}

// Init
populateTeamSelect();
renderTeam('nyk');
renderGames();
</script>
</body>
</html>
