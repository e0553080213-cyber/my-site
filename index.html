<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרוסטרים המלאים 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0B0E14; --card: #151A24; --card-line: #232B3A; --text: #EDEFF4;
  --muted: #8B93A7; --orange: #E8743B; --red: #E5484D; --green: #3CB878;
}
*{box-sizing:border-box;}
body{ margin:0; background: var(--bg); color: var(--text); font-family: 'Heebo', sans-serif; padding: 32px 16px 64px; }
body.ltr{ direction: ltr; }
.wrap{max-width: 980px; margin: 0 auto;}
.hero{ position:relative; text-align:center; padding: 24px 20px 28px; border-bottom: 1px solid var(--card-line); margin-bottom: 20px; }
.hero .eyebrow{ color: var(--orange); font-weight: 700; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
.hero h1{ font-size: 27px; font-weight: 900; margin: 10px 0 8px; line-height: 1.25; }
.hero p{ color: var(--muted); font-size: 14px; max-width: 620px; margin: 0 auto; line-height: 1.7; }
.lang-switch{ position:absolute; top:0; inset-inline-end:0; }
.lang-select{ background: var(--card); border:1px solid var(--card-line); color: var(--text); font-family:inherit; font-weight:700; font-size:12.5px; padding:8px 12px; border-radius:999px; cursor:pointer; }
.mainnav{ display:flex; gap:8px; justify-content:center; margin-bottom: 22px; flex-wrap:wrap; }
.navbtn{ padding: 10px 22px; border-radius: 999px; border: 1px solid var(--card-line); background: var(--card); color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
.navbtn.active{ color: var(--bg); background: var(--orange); border-color: var(--orange); }

.team-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
@media (max-width: 760px){ .team-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px){ .team-grid{ grid-template-columns: 1fr; } }
.team-card{ cursor:pointer; background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 15px; text-align: start; transition: transform .15s, border-color .15s; position:relative; overflow:hidden; }
.team-card:hover{ transform: translateY(-2px); border-color: var(--accent); }
.team-card .accent-bar{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:5px; background: var(--accent); }
.team-card h3{ margin:0 0 5px; font-size:16px; font-weight:900; }
.team-card .meta{ color: var(--muted); font-size: 11.5px; line-height:1.6; }
.team-card .badges{ margin-top:8px; display:flex; gap:5px; flex-wrap:wrap; }
.pill{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
.pill.inj{ background: rgba(229,72,77,.15); color: var(--red); }
.pill.roster{ background: rgba(255,255,255,.06); color: var(--muted); }
.pill.unverified{ background: rgba(232,116,59,.12); color: var(--orange); }

.back-btn{ background:none; border:1px solid var(--card-line); color: var(--muted); font-family:inherit; font-size:13px; font-weight:700; padding:8px 16px; border-radius: 999px; cursor:pointer; margin-bottom:16px; }
.back-btn:hover{ color:var(--text); border-color: var(--orange); }

.team-head{ display:flex; align-items:baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.team-head h2{ font-size: 21px; font-weight: 900; margin: 0; }
.team-head .note{ font-size: 12.5px; color: var(--muted); }

.approx-banner{ background: rgba(232,116,59,.08); border:1px solid rgba(232,116,59,.3); color: var(--orange); font-size:12px; font-weight:700; padding:9px 12px; border-radius:8px; margin-bottom:14px; }

.injured-box{ background: rgba(229,72,77,.06); border: 1px solid rgba(229,72,77,.25); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
.injured-box h4{ margin:0 0 10px; font-size: 13px; color: var(--red); font-weight:800; display:flex; align-items:center; gap:6px; }
.injured-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-top: 1px solid rgba(229,72,77,.15); }
.injured-row:first-of-type{ border-top:none; }
.injured-row img, .injured-row .avatar-mini{ width:34px; height:25px; object-fit:cover; border-radius:4px; background:var(--card-line); }
.injured-row .iname{ font-weight:700; font-size:13.5px; }
.injured-row .istatus{ font-size:11.5px; color: var(--muted); }
.injured-empty{ color: var(--muted); font-size: 12.5px; }

table{ width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--card-line); border-radius: 12px; overflow: hidden; font-size: 13.5px; }
thead th{ text-align: start; font-size: 11px; letter-spacing: .4px; color: var(--muted); font-weight: 700; padding: 10px 10px; border-bottom: 1px solid var(--card-line); background: rgba(255,255,255,0.02); white-space: nowrap; }
thead th.num{ text-align: center; }
thead th.imgcol{ text-align: center; width: 50px; }
tbody td{ padding: 9px 10px; border-bottom: 1px solid var(--card-line); vertical-align: middle; }
tbody tr{ cursor: pointer; transition: background 0.2s; }
tbody tr:hover{ background: rgba(255, 255, 255, 0.05); }
tbody td.num{ text-align: center; color: var(--muted); }
tbody td.imgtd{ text-align: center; padding: 4px; }
tbody tr:last-child td{ border-bottom: none; }
tbody tr.star td{ background: rgba(232,116,59,0.06); }
tbody tr.injured-row-flag td{ background: rgba(229,72,77,0.05); }
.player{ font-weight: 700; font-size: 14px; }
.role{ display:block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.badge{ display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; margin-inline-start: 6px; vertical-align: middle; }
.badge.new{ background: rgba(30,158,90,.18); color:#6FE3A5; }
.badge.inj{ background: rgba(229,72,77,.18); color: var(--red); }
.player-img{ width: 44px; height: 32px; object-fit: cover; border-radius: 4px; background: var(--card-line); display: block; margin: 0 auto; }
.avatar-circle{ width: 32px; height: 32px; border-radius: 50%; display:flex; align-items:center; justify-content:center; margin:0 auto; font-size:11px; font-weight:800; color:#fff; }
.legend{ font-size: 11.5px; color: var(--muted); margin: 10px 2px 20px; }
.foot{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.6; }

.games-list{ display:flex; flex-direction:column; gap:10px; }
.game-card{ background: var(--card); border:1px solid var(--card-line); border-radius:12px; padding:14px 16px; }
.game-card .glabel{ font-size:11px; color: var(--orange); font-weight:800; text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px; }
.game-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; font-size:15px; }
.game-row .vs{ color:var(--muted); font-weight:600; font-size:12.5px; }
.game-card .gnote{ margin-top:6px; color:var(--muted); font-size:12px; }
.games-note{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:14px; line-height:1.6; }

.standings-wrap{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 700px){ .standings-wrap{ grid-template-columns: 1fr; } }
.standings-table h3{ font-size:14px; margin:0 0 8px; color: var(--orange); font-weight:800; }
.standings-table table{ font-size:12.5px; }
.standings-table td.teamcell{ display:flex; align-items:center; gap:8px; font-weight:700; }
.seed-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

.modal-overlay{ display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
.modal-overlay.active{ display: flex; }
.modal-content{ background: var(--card); border: 1px solid var(--card-line); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 88vh; overflow-y: auto; }
.modal-close{ position: absolute; top: 12px; inset-inline-start: 16px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.modal-img{ width: 100px; height: 75px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
.modal-avatar{ width:100px; height:75px; border-radius:8px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:#fff; }
.modal-name{ font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.modal-en{ color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.modal-bio{ color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.modal-injury{ background: rgba(229,72,77,.1); border:1px solid rgba(229,72,77,.3); color: var(--red); font-size:12px; font-weight:700; padding:8px 10px; border-radius:8px; margin-bottom:14px; text-align:start; }
.modal-approx{ background: rgba(232,116,59,.08); border:1px solid rgba(232,116,59,.3); color: var(--orange); font-size:11.5px; font-weight:600; padding:7px 10px; border-radius:8px; margin-bottom:12px; text-align:start; }
.stats-grid{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: start; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 14px; }
.stat-item{ font-size: 13px; }
.stat-item span{ color: var(--muted); }
.modal-section{ text-align: start; background: rgba(0,0,0,0.15); padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; }
.modal-section h4{ margin: 0 0 6px; font-size: 12px; color: var(--orange); font-weight: 700; letter-spacing: .3px; }
.modal-section p{ margin: 0; font-size: 13px; line-height: 1.6; color: var(--text); }
.team-tag{ display:inline-block; background: rgba(255,255,255,0.06); border: 1px solid var(--card-line); padding: 3px 9px; border-radius: 999px; font-size: 12px; margin: 2px 3px 2px 0; }
.hebrew-note{ font-size:10.5px; color:var(--muted); font-style:italic; margin-top:4px; }

@media (max-width: 640px){
  thead th:nth-child(7), tbody td:nth-child(7){ display:none; }
  .hero h1{ font-size: 21px; }
  table{ font-size: 12px; }
  .lang-switch{ position:static; margin-bottom:10px; display:flex; justify-content:center; }
}
</style>
</head>

</div>

function getPlayerImg(id){ return 'https://cdn.nba.com/headshots/nba/latest/260x190/' + id + '.png'; }
function initialsOf(name){
  const parts = name.replace(/[^A-Za-zÀ-ÿ\s]/g,'').trim().split(/\s+/);
  if(parts.length === 0 || !parts[0]) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

let state = { lang:'he', view:'teams', team:null };

function tr(key){ return T[state.lang][key]; }

function applyStaticText(){
  const t = T[state.lang];
  document.getElementById('eyebrowTxt').textContent = t.eyebrow;
  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroSubtitle').textContent =
    state.view === 'games' ? t.heroSubtitleGames :
    state.view === 'standings' ? t.heroSubtitleStandings : t.heroSubtitleTeams;
  document.getElementById('navTeamsBtn').textContent = t.navTeams;
  document.getElementById('navGamesBtn').textContent = t.navGames;
  document.getElementById('navStandingsBtn').textContent = t.navStandings;
  document.getElementById('footTxt').innerHTML = t.footHtml;
  document.getElementById('lHeight').textContent = t.height;
  document.getElementById('lMin').textContent = t.minutes;
  document.getElementById('lPts').textContent = t.points;
  document.getElementById('lReb').textContent = t.rebounds;
  document.getElementById('lAst').textContent = t.assists;
  document.getElementById('lPos').textContent = t.position;
  document.getElementById('lTeamsTitle').textContent = t.careerTeams;
  document.getElementById('lAwardsTitle').textContent = t.awardsTitle;

  const rtlLangs = ['he','ar'];
  const isRtl = rtlLangs.includes(state.lang);
  document.body.classList.toggle('ltr', !isRtl);
  document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', state.lang);
}

function teamName(key){ return state.lang === 'he' ? teamsMeta[key].he : teamsMeta[key].en; }
function teamNote(key){
  const m = teamsMeta[key];
  if(m.verified){ return state.lang === 'he' ? m.noteHe : m.noteEn; }
  const t = T[state.lang];
  const confLabel = m.conf === 'E' ? t.eastConf : t.westConf;
  return m.w + '-' + m.l + ' · ' + confLabel;
}
function teamLegend(key){
  const m = teamsMeta[key];
  if(m.verified){ return state.lang === 'he' ? m.legendHe : m.legendEn; }
  return T[state.lang].approxNote;
}

function avatarCell(p, color){
  if(p.id){
    return '<img class="player-img" src="' + getPlayerImg(p.id) + '" alt="' + p.en + '" onerror="this.style.visibility=\'hidden\'">';
  }
  return '<div class="avatar-circle" style="background:' + color + '">' + initialsOf(p.en) + '</div>';
}

function renderTeamsList(){
  const t = T[state.lang];
  let html = '<div class="team-grid">';
  Object.keys(teamsMeta).forEach(key => {
    const meta = teamsMeta[key];
    const injCount = (data[key] || []).filter(p => p.injured).length;
    html += '<div class="team-card" style="--accent:' + meta.color + '" onclick="selectTeam(\'' + key + '\')">' +
      '<div class="accent-bar"></div>' +
      '<h3>' + teamName(key) + '</h3>' +
      '<div class="meta">' + teamNote(key) + '</div>' +
      '<div class="badges">' +
        '<span class="pill roster">' + (data[key] || []).length + ' ' + t.rosterBadge + '</span>' +
        (injCount > 0 ? '<span class="pill inj">' + injCount + ' ' + t.injBadge + '</span>' : '') +
        (!meta.verified ? '<span class="pill unverified">' + t.unverifiedBadge + '</span>' : '') +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderTeamDetail(key){
  const t = T[state.lang];
  const meta = teamsMeta[key];
  const players = data[key] || [];
  const injured = players.filter(p => p.injured);

  let html = '<button class="back-btn" onclick="backToTeams()">' + (state.lang!=='he' && state.lang!=='ar' ? '← ' : '') + t.back + ((state.lang==='he'||state.lang==='ar') ? ' →' : '') + '</button>';
  html += '<div class="team-head"><h2>' + teamName(key) + '</h2><span class="note">' + teamNote(key) + '</span></div>';

  if(!meta.verified){
    html += '<div class="approx-banner">⚠ ' + t.approxNote + '</div>';
  }

  html += '<div class="injured-box"><h4>🩹 ' + t.injuredTitle + '</h4>';
  if(injured.length === 0){
    html += '<div class="injured-empty">' + t.injuredEmpty + '</div>';
  } else {
    injured.forEach(p => {
      html += '<div class="injured-row">' + avatarCell(p, meta.color) +
        '<div><div class="iname">' + (state.lang==='he' ? p.he : p.en) + '</div>' +
        '<div class="istatus">' + (state.lang==='he' ? p.injuryHe : p.injuryEn) + '</div></div>' +
      '</div>';
    });
  }
  html += '</div>';

  html += '<table><thead><tr><th class="num">' + t.colNum + '</th><th class="imgcol">' + t.colImg + '</th><th>' + t.colPlayer + '</th><th>' + t.colPos + '</th><th class="num">' + t.colPts + '</th><th class="num">' + t.colReb + '</th><th class="num">' + t.colAst + '</th></tr></thead><tbody>';
  players.forEach(p => {
    const badgeHtml = p.badge ? '<span class="badge new">' + p.badge + '</span>' : '';
    const injBadgeHtml = p.injured ? '<span class="badge inj">' + t.injBadge + '</span>' : '';
    const roleHtml = p.role ? '<span class="role">' + p.role + '</span>' : '';
    const rowClass = (p.star ? 'star ' : '') + (p.injured ? 'injured-row-flag' : '');
    html += '<tr class="' + rowClass + '" onclick="showPlayerDetails(\'' + key + '\', ' + p.rank + ')">' +
      '<td class="num">' + p.rank + '</td>' +
      '<td class="imgtd">' + avatarCell(p, meta.color) + '</td>' +
      '<td class="player">' + (state.lang==='he' ? p.he : p.en) + badgeHtml + injBadgeHtml + roleHtml + '</td>' +
      '<td>' + p.pos + '</td>' +
      '<td class="num">' + p.pts.toFixed(1) + '</td>' +
      '<td class="num">' + p.reb.toFixed(1) + '</td>' +
      '<td class="num">' + p.ast.toFixed(1) + '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  html += '<div class="legend">' + teamLegend(key) + '</div>';

  document.getElementById('content').innerHTML = html;
}

function renderGames(){
  const t = T[state.lang];
  let html = '<div class="games-list">';
  games.forEach(g => {
    const home = state.lang==='he' ? g.homeHe : g.homeEn;
    const away = state.lang==='he' ? g.awayHe : g.away;
    const note = state.lang==='he' ? g.noteHe : g.noteEn;
    const label = state.lang==='he' ? g.labelHe : g.labelEn;
    html += '<div class="game-card">' +
      '<div class="glabel">' + label + '</div>' +
      '<div class="game-row"><span>' + home + '</span><span class="vs">' + g.score + '</span><span>' + away + '</span></div>' +
      '<div class="gnote">' + note + '</div>' +
    '</div>';
  });
  html += '</div><div class="games-note">' + t.gamesNote + '</div>';
  document.getElementById('content').innerHTML = html;
}

function renderStandingsTable(list, titleKey){
  const t = T[state.lang];
  let html = '<div class="standings-table"><h3>' + t[titleKey] + '</h3><table><thead><tr><th>' + t.colTeam + '</th><th class="num">' + t.colW + '</th><th class="num">' + t.colL + '</th><th class="num">' + t.colPct + '</th></tr></thead><tbody>';
  list.forEach((key, i) => {
    const m = teamsMeta[key];
    const pct = (m.w / (m.w + m.l)).toFixed(3).replace(/^0/, '');
    html += '<tr><td class="teamcell"><span class="seed-dot" style="background:' + m.color + '"></span>' + (i+1) + '. ' + teamName(key) + '</td><td class="num">' + m.w + '</td><td class="num">' + m.l + '</td><td class="num">' + pct + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderStandings(){
  let html = '<div class="standings-wrap">';
  html += renderStandingsTable(standingsEast, 'eastConf');
  html += renderStandingsTable(standingsWest, 'westConf');
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function render(){
  applyStaticText();
  if(state.view === 'teams'){
    if(state.team){ renderTeamDetail(state.team); } else { renderTeamsList(); }
  } else if(state.view === 'games'){
    renderGames();
  } else {
    renderStandings();
  }
}

function selectTeam(key){ state.team = key; render(); }
function backToTeams(){ state.team = null; render(); }

function setActiveNav(view){
  document.getElementById('navTeamsBtn').classList.toggle('active', view==='teams');
  document.getElementById('navGamesBtn').classList.toggle('active', view==='games');
  document.getElementById('navStandingsBtn').classList.toggle('active', view==='standings');
}
document.getElementById('navTeamsBtn').addEventListener('click', () => { state.view='teams'; state.team=null; setActiveNav('teams'); render(); });
document.getElementById('navGamesBtn').addEventListener('click', () => { state.view='games'; state.team=null; setActiveNav('games'); render(); });
document.getElementById('navStandingsBtn').addEventListener('click', () => { state.view='standings'; state.team=null; setActiveNav('standings'); render(); });
document.getElementById('langSelect').addEventListener('change', (e) => { state.lang = e.target.value; render(); });

function showPlayerDetails(teamKey, rank) {
  const player = (data[teamKey] || []).find(p => p.rank === rank);
  if(!player) return;
  const t = T[state.lang];
  const meta = teamsMeta[teamKey];

  const avatarWrap = document.getElementById('mAvatarWrap');
  if(player.id){
    avatarWrap.innerHTML = '<img id="mImg" class="modal-img" src="' + getPlayerImg(player.id) + '" alt="">';
  } else {
    avatarWrap.innerHTML = '<div class="modal-avatar" style="background:' + meta.color + '">' + initialsOf(player.en) + '</div>';
  }

  document.getElementById('mName').innerText = state.lang==='he' ? player.he : player.en;
  document.getElementById('mEn').innerText = state.lang==='he' ? player.en : player.he;

  const approxBox = document.getElementById('mApproxBox');
  if(!meta.verified){
    approxBox.style.display = 'block';
    approxBox.textContent = '⚠ ' + t.approxNote;
  } else {
    approxBox.style.display = 'none';
  }

  if(player.dob){
    document.getElementById('mBio').innerHTML = 'גיל ' + player.age + ' · נולד/ה ' + player.dob + ' · ' + player.birthplace +
      (state.lang!=='he' ? '<div class="hebrew-note">' + t.hebNote + '</div>' : '');
  } else {
    document.getElementById('mBio').innerHTML = t.noDetail;
  }

  const injBox = document.getElementById('mInjuryBox');
  if(player.injured){
    injBox.style.display = 'block';
    injBox.textContent = '🩹 ' + (state.lang==='he' ? player.injuryHe : player.injuryEn);
  } else {
    injBox.style.display = 'none';
  }

  document.getElementById('mHeight').innerText = player.height || '—';
  document.getElementById('mMin').innerText = player.min ? player.min + (state.lang==='he' ? ' דק\'' : ' min') : '—';
  document.getElementById('mPts').innerText = player.pts.toFixed(1);
  document.getElementById('mReb').innerText = player.reb.toFixed(1);
  document.getElementById('mAst').innerText = player.ast.toFixed(1);
  document.getElementById('mPos').innerText = player.pos;

  const teamsSection = document.getElementById('mTeamsSection');
  const awardsSection = document.getElementById('mAwardsSection');
  if(player.teams){
    teamsSection.style.display = 'block';
    document.getElementById('mTeams').innerHTML = player.teams.map(tm => '<span class="team-tag">' + tm + '</span>').join(' ');
  } else { teamsSection.style.display = 'none'; }
  if(player.awards){
    awardsSection.style.display = 'block';
    document.getElementById('mAwards').innerText = player.awards;
  } else { awardsSection.style.display = 'none'; }

  document.getElementById('playerModal').classList.add('active');
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('playerModal').classList.remove('active');
});
document.getElementById('playerModal').addEventListener('click', (e) => {
  if (e.target.id === 'playerModal') {
    document.getElementById('playerModal').classList.remove('active');
  }
});

render();
</script>
